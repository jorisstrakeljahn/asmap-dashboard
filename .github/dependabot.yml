# Keep Actions majors and the tiny npm test tooling from rotting, and
# create regular repository activity so GitHub does not disable the
# nightly schedules after 60 days of idle.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
