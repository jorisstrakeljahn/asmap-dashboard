name: pages

# The dashboard's data layer is split along update frequency:
#   - metrics.json + diffs.json: cached by asmap-data revision, schema, and
#     map-analysis code. They rebuild only when one of those inputs changes.
#   - network.json: rebuilt daily from the public snapshots on the
#     `network-snapshots` release (archived bitnodes.io crawls + daily
#     bitnod.es CSVs) and a cached Team Cymru BGP-origin lookup.
#   - asn-names.json: rebuilt from bgp.tools, scoped to the ASNs the
#     other payloads reference.
# Triggers:
#   - push to main: redeploy when web/, the pipeline, or the workflow changes
#   - daily cron: pick up new asmap-data builds, the newest bitnod.es
#     snapshot, and ASN-name updates
#   - manual dispatch: ad-hoc rebuild
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on the same fast checks the tests workflow runs.
  # Duplicating them here (rather than chaining via workflow_run) keeps
  # the cron and manual-dispatch paths gated too, because the gate runs
  # in the same workflow run as the deploy. JS tests are included because
  # the deploy ships the web/ logic - a broken pure function would
  # otherwise reach production on a cron run with no PR to catch it.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: python -m ruff check

      - run: python -m pytest tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm test

  build-and-deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install asmap_dashboard
        run: pip install -e .

      - name: Clone bitcoin-core/asmap-data
        run: git clone --depth=1 https://github.com/bitcoin-core/asmap-data.git /tmp/asmap-data

      - name: Read asmap-data revision
        id: asmap-data
        run: echo "revision=$(git -C /tmp/asmap-data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore generated map payloads
        id: map-payload-cache
        uses: actions/cache@v6
        with:
          path: |
            web/assets/data/metrics.json
            web/assets/data/diffs.json
          key: map-payload-v10-${{ steps.asmap-data.outputs.revision }}-${{ hashFiles('asmap_dashboard/analyze.py', 'asmap_dashboard/diff.py', 'asmap_dashboard/loader.py', 'asmap_dashboard/metrics.py', 'asmap_dashboard/cli.py', 'asmap_dashboard/_prefix.py', 'asmap_dashboard/netgroup.py', 'asmap_dashboard/_vendor/asmap.py') }}

      - name: Generate metrics.json and diffs.json
        if: steps.map-payload-cache.outputs.cache-hit != 'true'
        run: |
          python -m asmap_dashboard metrics \
            --data-dir /tmp/asmap-data \
            --out web/assets/data/metrics.json

      # Public observed-node snapshots: the archived bitnodes.io crawls
      # (tar) plus the daily bitnod.es CSVs (gzipped, appended by
      # fetch-bitmex.yml). The snapshot loader reads plain .json/.csv,
      # so the assets are unpacked into one directory tree.
      - name: Download public node snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/snapshots/live
          gh release download network-snapshots -R "$GITHUB_REPOSITORY" \
            --dir /tmp/snapshot-assets
          tar -xzf /tmp/snapshot-assets/bitnodes-asmap.tar.gz -C /tmp/snapshots
          for f in /tmp/snapshot-assets/bitcoin_nodes_*.csv.gz; do
            gunzip -c "$f" > "/tmp/snapshots/live/$(basename "$f" .gz)"
          done

      # Caches raw lookup records between runs. The cache is never copied into
      # web/, and the public payload contains aggregate counts only. A daily key
      # lets each successful run save its refreshed TTL state.
      - name: Set WHOIS cache date
        id: whois-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore private WHOIS cache
        uses: actions/cache@v6
        with:
          path: cache/whois/records.json
          key: whois-v2-${{ steps.whois-date.outputs.date }}
          restore-keys: |
            whois-v2-

      - name: Generate network.json with Team Cymru cross-check
        run: |
          python -m asmap_dashboard network \
            --data-dir /tmp/asmap-data \
            --bitnodes-dir /tmp/snapshots \
            --whois-cache cache/whois/records.json \
            --whois-team-cymru \
            --whois-cache-max-age-hours 24 \
            --out web/assets/data/network.json

      - name: Refresh ASN names from bgp.tools
        # Non-fatal: if bgp.tools is unreachable we still ship the
        # payloads and the dashboard falls back to bare AS<num> labels.
        # network.json is listed even though it may not exist; the command
        # skips missing files with a warning.
        continue-on-error: true
        run: |
          python -m asmap_dashboard refresh-asn-names \
            --payload web/assets/data/metrics.json \
                      web/assets/data/diffs.json \
                      web/assets/data/network.json \
            --out web/assets/data/asn-names.json

      # Guard against deploying an empty or silently stale dashboard.
      # Upstream layout changes can make map discovery return nothing
      # without erroring; a dead bitnod.es feed can leave last week's
      # CSV as "latest" forever. Fail closed so the previous site stays.
      - name: Smoke-check generated payloads
        run: |
          jq -e '.maps | length > 0' web/assets/data/metrics.json > /dev/null
          jq -e '.schema_version' web/assets/data/metrics.json > /dev/null
          jq -e '.top_movers | type == "object"' web/assets/data/diffs.json > /dev/null
          jq -e '.network.sources | length > 0' web/assets/data/network.json > /dev/null
          jq -e '.network.reality_attribution.provider == "team-cymru"' \
            web/assets/data/network.json > /dev/null
          jq -e '.network.reality_attribution.coverage_pct >= 50' \
            web/assets/data/network.json > /dev/null
          jq -e '.network.reality_attribution.nodes_clearnet > 0' \
            web/assets/data/network.json > /dev/null
          # 3 days matches fetch-bitmex lookback: short Actions outages
          # self-heal; a silent source death must not keep shipping.
          now=$(date -u +%s)
          jq -e --argjson now "$now" '
            (.network.reality_attribution.snapshot_timestamp | type == "number")
            and (
              ($now - .network.reality_attribution.snapshot_timestamp)
              < (3 * 86400)
            )
          ' web/assets/data/network.json > /dev/null

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
