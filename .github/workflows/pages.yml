name: pages

# The dashboard's data layer is split along reproducibility lines:
#   - metrics.json + diffs.json: rebuilt fresh on every deploy from the
#     public bitcoin-core/asmap-data history; never committed.
#   - network.json: rebuilt fresh from the public snapshots on the
#     `network-snapshots` release (archived bitnodes.io crawls + daily
#     bitnod.es CSVs appended by fetch-bitmex.yml), then merged with
#     the committed data/network-kit.json, the KIT series that can only
#     be regenerated locally from the non-public dossiers.
#   - asn-names.json: rebuilt from bgp.tools, scoped to the ASNs the
#     other payloads reference.
# Triggers:
#   - push to main: redeploy when web/, the pipeline, or the workflow changes
#   - daily cron: pick up new asmap-data builds, the newest bitnod.es
#     snapshot, and ASN-name updates
#   - manual dispatch: ad-hoc rebuild
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on the same fast checks the tests workflow runs.
  # Duplicating them here (rather than chaining via workflow_run) keeps
  # the cron and manual-dispatch paths gated too, because the gate runs
  # in the same workflow run as the deploy. JS tests are included because
  # the deploy ships the web/ logic - a broken pure function would
  # otherwise reach production on a cron run with no PR to catch it.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: python -m ruff check

      - run: python -m pytest tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm test

  build-and-deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install asmap_dashboard
        run: pip install -e .

      - name: Clone bitcoin-core/asmap-data
        run: git clone --depth=1 https://github.com/bitcoin-core/asmap-data.git /tmp/asmap-data

      # Public observed-node snapshots: the archived bitnodes.io crawls
      # (tar) plus the daily bitnod.es CSVs (gzipped, appended by
      # fetch-bitmex.yml). The snapshot loader reads plain .json/.csv,
      # so the assets are unpacked into one directory tree.
      - name: Download public node snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/snapshots/bitmex
          gh release download network-snapshots -R "$GITHUB_REPOSITORY" \
            --dir /tmp/snapshot-assets
          tar -xzf /tmp/snapshot-assets/bitnodes-asmap.tar.gz -C /tmp/snapshots
          for f in /tmp/snapshot-assets/bitcoin_nodes_*.csv.gz; do
            gunzip -c "$f" > "/tmp/snapshots/bitmex/$(basename "$f" .gz)"
          done
          ls -R /tmp/snapshots | head -40

      # Writes metrics.json (maps), diffs.json, and network.json from
      # public inputs only. The KIT series lives in the committed
      # data/network-kit.json and is grafted in by the merge step.
      - name: Generate metrics.json + diffs.json + network.json
        run: |
          python -m asmap_dashboard metrics \
            --data-dir /tmp/asmap-data \
            --bitnodes-dir /tmp/snapshots \
            --out web/assets/data/metrics.json

      - name: Merge committed KIT series into network.json
        run: |
          python -m asmap_dashboard merge-network \
            --base web/assets/data/network.json \
            --extra data/network-kit.json \
            --out web/assets/data/network.json

      - name: Refresh ASN names from bgp.tools
        # Non-fatal: if bgp.tools is unreachable we still ship the
        # payloads and the dashboard falls back to bare AS<num> labels.
        # network.json is listed even though it may not exist (public
        # deploys without the KIT preview); refresh-asn-names skips
        # missing files with a warning.
        continue-on-error: true
        run: |
          python -m asmap_dashboard refresh-asn-names \
            --payload web/assets/data/metrics.json \
                      web/assets/data/diffs.json \
                      web/assets/data/network.json \
            --out web/assets/data/asn-names.json

      # Guard against deploying an empty dashboard: an upstream layout
      # change makes map discovery return nothing without erroring, so
      # assert the generated payloads are non-empty before publishing.
      - name: Smoke-check generated payloads
        run: |
          jq -e '.maps | length > 0' web/assets/data/metrics.json > /dev/null
          jq -e '.schema_version' web/assets/data/metrics.json > /dev/null
          jq -e '.diffs | length >= 0' web/assets/data/diffs.json > /dev/null
          jq -e '.network.sources | length > 0' web/assets/data/network.json > /dev/null

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
